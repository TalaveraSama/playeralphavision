name: xtream_player
description: "Cliente OTT/IPTV multiplataforma (Android/iOS) con el diseño NOVA para la API de Xtream Codes y paneles XUI.one."
publish_to: "none"
version: 1.2.44+1048
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.0
  android_intent_plus: ^5.2.0
  package_info_plus: ^10.2.2
  media_kit: ^1.2.6
  media_kit_video: ^1.2.0
  media_kit_libs_android_video: ^1.3.8
  path_provider: ^2.1.6
  device_info_plus: ^13.3.0
  youtube_explode_dart: ^2.5.0
  webview_flutter: ^4.8.0
  fijkplayer_plus: ^0.0.1
  flutter_vlc_player: ^7.4.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
